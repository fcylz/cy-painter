<!DOCTYPE html>
<html>
<head>
<script>
// 保留全部query参数，重定向到 pages/index.html
const dest = new URL("./pages/index.html", window.location.href);

new URLSearchParams(window.location.search).forEach((v,k)=>{
  dest.searchParams.set(k, v);
});
window.location.replace(dest.href);
</script>
</head>
<body></body>
</html>
